services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    image: n8nio/n8n:2.6.4
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET}
      WEBHOOK_MAX_SKEW_SECONDS: ${WEBHOOK_MAX_SKEW_SECONDS}
      MOCK_CRM_URL: ${MOCK_CRM_URL}
      MOCK_JC_URL: ${MOCK_JC_URL}
      PROCESSOR_URL: http://processor:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./alerts:/alerts
    depends_on:
      postgres:
        condition: service_healthy

  processor:
    build: ./processor
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET}
      WEBHOOK_MAX_SKEW_SECONDS: ${WEBHOOK_MAX_SKEW_SECONDS}
      PROCESSOR_LOG_LEVEL: ${PROCESSOR_LOG_LEVEL}
      EMAIL_HASH_SALT: ${EMAIL_HASH_SALT}
      MOCK_CRM_URL: ${MOCK_CRM_URL}
    depends_on:
      postgres:
        condition: service_healthy

  mock-crm:
    build: ./mock-crm
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

  mock-jira-confluence:
    build: ./mock-jira-confluence
    ports:
      - "127.0.0.1:9002:9002"
    volumes:
      - ./alerts:/alerts
    environment:
      ALERTS_DIR: /alerts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  n8n_data:
